task: uav_tree_crown
model: yolov8n.pt

train:
  data: datasets/oil_palm/uav_tree_crown/yolo/data.yaml
  project: models/oil_palm/uav_tree_crown/runs
  name: uav_yolo_tree_crown_detector_v1
  epochs: 120
  imgsz: 640
  batch: 16
  device: null
  workers: 4
  patience: 30
  seed: 42
  optimizer: auto
  cache: false
  exist_ok: true
  pretrained: true

augment:
  degrees: 20
  translate: 0.1
  scale: 0.5
  shear: 1
  perspective: 0.0002
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.3
  mosaic: 0.7
  mixup: 0.05
  copy_paste: 0.0

outputs:
  runs_dir: models/oil_palm/uav_tree_crown/runs
  trained_run: models/oil_palm/uav_tree_crown/runs/uav_yolo_tree_crown_detector_v1
  tracked_metrics_file: models/oil_palm/uav_tree_crown/metrics.json

notes:
  - UAV v1 is a single-class oil_palm_crown detector.
  - Cloud remains responsible for tile offsets, global coordinates, NMS, and human confirmation.
  - The first Roboflow export has no validation/test split, so preparation creates a deterministic 70/15/15 split.
  - Review license status before publishing trained weights.
