task: uav_tree_crown
model: yolov8n.pt

train:
  data: datasets/oil_palm/uav_tree_crown/yolo/data.yaml
  project: models/oil_palm/uav_tree_crown/runs
  name: uav_yolo_tree_crown_detector_v1
  epochs: 100
  imgsz: 640
  batch: 16
  device: null
  workers: 4
  patience: 20
  seed: 42
  optimizer: auto
  cache: false
  exist_ok: true
  pretrained: true

augment:
  degrees: 0
  translate: 0.0
  scale: 0.0
  shear: 0
  perspective: 0.0
  fliplr: 0.0
  flipud: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0

outputs:
  runs_dir: models/oil_palm/uav_tree_crown/runs
  trained_run: models/oil_palm/uav_tree_crown/runs/uav_yolo_tree_crown_detector_v1
  tracked_metrics_file: models/oil_palm/uav_tree_crown/metrics.json

notes:
  - UAV v1 is a single-class oil_palm_crown detector.
  - Cloud remains responsible for tile offsets, global coordinates, NMS, and human confirmation.
  - Roboflow version 1 already provides train/valid/test splits; preparation preserves them.
  - Roboflow-side augmentation has already been applied, so additional Ultralytics augmentation is disabled for the first baseline.
  - Review license status before publishing trained weights.
