[receiver]
bind = "0.0.0.0:9000"
once = false
timeout_ms = 30000
ack_mismatch = "ack:error"
ack_unknown_sensor = "ack:unknown_sensor"
token_store_path = "state/token_store.json"
registry_path = "state/registry.json"
image_store_path = "state/image_uploads"
image_index_path = "state/image_index.jsonl"
image_db_error_store_path = "state/image_upload_errors.jsonl"
database_url = "postgres://postgres:CHANGE_ME@db:5432/ai_agriculture"
ai_predict_url = "http://ai-engine:8000/api/v1/predict"
# Optional runtime A0 detector. Keep unset to use Cloud's local mock A0 fallback.
# Set via environment in deployment:
# AI_OIL_PALM_A0_DETECT_URL="http://ai-engine:8000/api/v1/oil-palm/a0/detect"
# Optional runtime oil palm analyzer. Set to enable real Ganoderma after
# trunk_base A0 confirmation when AI Engine has Ganoderma weights mounted.
# The UAV /detect-palms endpoint also requires this URL and calls it with
# image_role=uav_tile; use /detections/mock for explicit local mock detections.
# AI_OIL_PALM_ANALYZE_URL="http://ai-engine:8000/api/v1/oil-palm/analyze"
# Optional guard for in-process UAV orthomosaic decode before tile cropping.
# UAV_ORTHOMOSAIC_MAX_DECODE_PIXELS="120000000"
openclaw_url = "http://openclaw:3000"

[[exact_payloads]]
payload = "success"
ack = "ack:success"

[[sensors]]
id = "dht22"
ack = "ack:dht22"
required_fields = ["temp_c", "hum"]

[sensors.field_types]
temp_c = "f32"
hum = "f32"

[[sensors]]
id = "adc"
ack = "ack:adc"
required_fields = ["pin", "raw", "voltage"]

[sensors.field_types]
pin = "u8"
raw = "u16"
voltage = "f32"

[[sensors]]
id = "soil_modbus_02"
ack = "ack:soil_modbus_02"
required_fields = ["vwc", "temp_c", "ec"]

[sensors.field_types]
vwc = "f32"
temp_c = "f32"
ec = "u32"
protocol = "string"
slave_id = "u16"
